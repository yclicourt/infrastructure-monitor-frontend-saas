<svg
  width="200"
  height="240"
  viewBox="0 0 200 240"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Gradiente del escudo corporativo -->
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f243a" />
      <stop offset="100%" stop-color="#3f5d7c" />
    </linearGradient>

    <!-- Gradientes de la nube y servidores originales -->
    <linearGradient id="cloudGradient" x1="0%" y1="10%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#24D1D4"/>
      <stop offset="48%" stop-color="#1FA8E0"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="serverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#243B55"/>
      <stop offset="100%" stop-color="#0B162A"/>
    </linearGradient>

    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Fondo: Escudo -->
  <path
    d="
      M100 10
      C140 30, 180 40, 180 40
      V150
      C180 185, 140 215, 100 230
      C60 215, 20 185, 20 150
      V40
      C20 40, 60 30, 100 10
      Z
    "
    fill="url(#shieldGradient)"
    filter="url(#shieldShadow)"
  />

  <!-- Contenido interior: Nube e infraestructura de servidores adaptados al escudo -->
  <g transform="translate(100, 120) scale(0.24) translate(-270, -260)">
    <!-- Nube -->
    <path
      d="
        M 85 365
        C 36 365, 0 327, 0 275
        C 0 221, 40 180, 95 180
        C 120 105, 185 50, 270 50
        C 354 50, 419 105, 443 180
        C 500 180, 540 221, 540 275
        C 540 327, 504 365, 455 365
        Z
      "
      fill="url(#cloudGradient)"
    />

    <!-- Servidor rack 1 -->
    <rect x="145" y="200" width="250" height="58" rx="14" fill="url(#serverGradient)" stroke="#5EAED4" stroke-width="4"/>
    <circle cx="182" cy="229" r="11" fill="#24D1D4"/>
    <rect x="266" y="221" width="85" height="10" rx="5" fill="#53B6E5"/>

    <!-- Servidor rack 2 -->
    <rect x="145" y="270" width="250" height="58" rx="14" fill="url(#serverGradient)" stroke="#4C8FC2" stroke-width="4"/>
    <circle cx="182" cy="299" r="11" fill="#24D1D4"/>
    <rect x="266" y="291" width="85" height="10" rx="5" fill="#53B6E5"/>

    <!-- Servidor rack 3 -->
    <rect x="145" y="340" width="250" height="58" rx="14" fill="url(#serverGradient)" stroke="#396E98" stroke-width="4"/>
    <circle cx="182" cy="369" r="11" fill="#24D1D4"/>
    <rect x="266" y="361" width="85" height="10" rx="5" fill="#53B6E5"/>
  </g>
</svg>
