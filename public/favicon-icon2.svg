<svg
  width="512"
  height="512"
  viewBox="0 0 512 512"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="cloudGradient" x1="0%" y1="10%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#24D1D4"/>
      <stop offset="48%" stop-color="#1FA8E0"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="serverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#243B55"/>
      <stop offset="100%" stop-color="#0B162A"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado estilo app icon / favicon moderno -->
  <rect width="512" height="512" rx="110" fill="#070E1B"/>

  <!-- Nube centrada y optimizada para favicon -->
  <g transform="translate(-14, -10)">
    <path
      d="
        M 115 365
        C 66 365, 30 327, 30 275
        C 30 221, 70 180, 125 180
        C 150 105, 215 50, 300 50
        C 384 50, 449 105, 473 180
        C 530 180, 570 221, 570 275
        C 570 327, 534 365, 485 365
        Z
      "
      fill="url(#cloudGradient)"
    />

    <!-- Servidores internos simplificados y contundentes -->
    <rect x="135" y="200" width="245" height="58" rx="14" fill="url(#serverGradient)" stroke="#5EAED4" stroke-width="4"/>
    <circle cx="172" cy="229" r="11" fill="#24D1D4"/>
    <rect x="256" y="221" width="83" height="10" rx="5" fill="#53B6E5"/>

    <rect x="135" y="270" width="245" height="58" rx="14" fill="url(#serverGradient)" stroke="#4C8FC2" stroke-width="4"/>
    <circle cx="172" cy="299" r="11" fill="#24D1D4"/>
    <rect x="256" y="291" width="83" height="10" rx="5" fill="#53B6E5"/>

    <rect x="135" y="340" width="245" height="58" rx="14" fill="url(#serverGradient)" stroke="#396E98" stroke-width="4"/>
    <circle cx="172" cy="369" r="11" fill="#24D1D4"/>
    <rect x="256" y="361" width="83" height="10" rx="5" fill="#53B6E5"/>
  </g>
</svg>
